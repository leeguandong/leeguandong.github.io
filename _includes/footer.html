{% if site.footer_fixed %}
<footer class="fixed-bottom">
{% else %}
<footer class="mt-5">
{% endif %}
  <div class="container">
    &copy; {{ site.time | date: '%Y' }} {{ site.first_name }} {{ site.last_name }}.
    {% if site.last_updated %}Last updated: {{ "now" | date: '%B %d, %Y' }}.{% endif %}
  </div>
</footer>
