<footer class="colophon">
  <div class="colophon-inner">
    <div class="colophon-row">
      <span class="colophon-label">Colophon</span>
      <span class="colophon-text">
        Set in <em>Instrument Serif</em>, <em>Fraunces</em>, and <em>JetBrains&nbsp;Mono</em>.
        Hand-built. No frameworks.
      </span>
    </div>
    <div class="colophon-row">
      <span class="colophon-label">Imprint</span>
      <span class="colophon-text">
        © {{ site.time | date: '%Y' }} {{ site.first_name }} {{ site.last_name }}.
        {% if site.last_updated %}Last revised {{ "now" | date: '%-d %B %Y' }}.{% endif %}
      </span>
    </div>
  </div>
</footer>
